<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkedIn Post Planner</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #5b6773;
      --line: #d9e1e8;
      --soft: #f3f6f8;
      --panel: #ffffff;
      --brand: #0a66c2;
      --brand-dark: #084d92;
      --green: #16764f;
      --yellow: #a15d00;
      --red: #b42318;
      --shadow: 0 12px 30px rgba(17, 35, 52, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #eef3f7;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      min-height: 38px;
      border-radius: 6px;
      padding: 0 12px;
      cursor: pointer;
    }

    button:hover { border-color: #aebdca; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 22px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: var(--brand);
      color: white;
      font-weight: 800;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .subtle {
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .primary {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
      font-weight: 700;
    }

    .primary:hover {
      background: var(--brand-dark);
      border-color: var(--brand-dark);
    }

    .icon-button {
      width: 40px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      font-weight: 800;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 0;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: #f8fafc;
      padding: 18px;
      overflow: auto;
    }

    .sidebar h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin: 4px 0 10px;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: white;
      border-radius: 6px;
      padding: 9px 10px;
      color: var(--ink);
      min-height: 38px;
    }

    textarea {
      min-height: 118px;
      resize: vertical;
      line-height: 1.45;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 16px 0;
    }

    .stat {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .filters {
      display: grid;
      gap: 8px;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      justify-content: flex-start;
      border-radius: 999px;
      background: white;
    }

    .chip.active {
      border-color: var(--brand);
      box-shadow: inset 0 0 0 1px var(--brand);
      color: var(--brand-dark);
      font-weight: 700;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 99px;
      background: var(--muted);
      flex: 0 0 auto;
    }

    .dot.idea { background: #6772e5; }
    .dot.draft { background: var(--yellow); }
    .dot.ready { background: var(--green); }
    .dot.posted { background: #59636e; }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px 12px;
      background: #eef3f7;
    }

    .month-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .month-title h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .view-toggle {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: white;
    }

    .view-toggle button {
      border: 0;
      border-radius: 0;
      min-width: 72px;
    }

    .view-toggle button.active {
      background: var(--ink);
      color: white;
      font-weight: 700;
    }

    .calendar-wrap {
      padding: 0 20px 20px;
      overflow: auto;
    }

    .calendar {
      min-width: 760px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .weekdays, .month-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekdays div {
      padding: 11px 10px;
      background: #f8fafc;
      border-right: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 800;
    }

    .weekdays div:last-child { border-right: 0; }

    .day {
      min-height: 210px;
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 8px;
      background: white;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .day:nth-child(7n) { border-right: 0; }

    .day.outside {
      background: #f7f9fb;
      color: #8b98a6;
    }

    .day.today {
      box-shadow: inset 0 0 0 2px var(--brand);
    }

    .day-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      min-height: 24px;
    }

    .day-number {
      font-weight: 800;
      font-size: 13px;
    }

    .mini-add {
      width: 26px;
      height: 26px;
      min-height: 26px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 0;
    }

    .mini-add:hover {
      background: var(--soft);
      color: var(--brand);
    }

    .post {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      display: grid;
      gap: 7px;
      cursor: pointer;
      background: #fff;
      min-height: 126px;
      box-shadow: 0 4px 12px rgba(17, 35, 52, .05);
    }

    .post:hover {
      border-color: #9db7cf;
    }

    .post.idea { box-shadow: inset 4px 0 0 #6772e5, 0 4px 12px rgba(17, 35, 52, .05); }
    .post.draft { box-shadow: inset 4px 0 0 var(--yellow), 0 4px 12px rgba(17, 35, 52, .05); }
    .post.ready { box-shadow: inset 4px 0 0 var(--green), 0 4px 12px rgba(17, 35, 52, .05); }
    .post.posted { box-shadow: inset 4px 0 0 #59636e, 0 4px 12px rgba(17, 35, 52, .05); }

    .post-author {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 7px;
      align-items: center;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #18364f, #86a8a7);
      color: white;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
    }

    .author-name {
      font-size: 12px;
      font-weight: 800;
      line-height: 1.1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .audience-line {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
    }

    .post-title {
      font-weight: 800;
      font-size: 12px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .post-copy {
      color: #27323d;
      font-size: 12px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-line;
    }

    .post-media {
      border: 1px solid #d9e1e8;
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      overflow: hidden;
    }

    .post-media.image-media {
      display: block;
      border: 0;
      border-radius: 8px;
      background: transparent;
    }

    .post-media img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    .post-document {
      width: 100%;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 7px;
      align-items: center;
      padding: 10px;
      text-align: left;
    }

    .attachment-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .post-document strong {
      display: block;
      overflow-wrap: anywhere;
      white-space: normal;
      line-height: 1.2;
    }

    .post-document small,
    .attachment-meta {
      color: var(--muted);
      font-weight: 500;
    }

    .post-meta {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      gap: 6px;
      align-items: center;
      min-width: 0;
    }

    .week-list {
      min-width: 720px;
      display: grid;
      gap: 10px;
    }

    .week-row {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .week-date {
      border-right: 1px solid var(--line);
      padding-right: 12px;
    }

    .week-date strong {
      display: block;
      font-size: 18px;
    }

    .week-posts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px;
      align-content: start;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 9px 0;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(14, 28, 42, .42);
      display: none;
      z-index: 20;
    }

    .drawer-backdrop.open { display: block; }

    .drawer {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(920px, calc(100vw - 28px));
      height: min(760px, calc(100vh - 28px));
      background: white;
      border-radius: 10px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .26);
      z-index: 30;
      transform: translate(-50%, -46%) scale(.98);
      opacity: 0;
      transition: transform .18s ease;
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
      pointer-events: none;
    }

    .drawer.open {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .drawer header {
      padding: 0;
      border-bottom: 0;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .drawer h2 {
      margin: 0;
      font-size: 20px;
    }

    .drawer-body {
      padding: 0;
      overflow: auto;
    }

    .drawer-actions {
      border-top: 1px solid var(--line);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      background: #fff;
    }

    .composer {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
    }

    .composer-top {
      padding: 14px 18px 0;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 12px;
    }

    .composer-close {
      border: 0;
      width: 42px;
      height: 42px;
      min-height: 42px;
      font-size: 32px;
      font-weight: 300;
      color: #333;
      background: transparent;
    }

    .composer-textarea {
      border: 0;
      border-radius: 0;
      min-height: 270px;
      resize: none;
      font-size: 26px;
      line-height: 1.35;
      padding: 24px 28px;
      color: #222;
    }

    .composer-textarea::placeholder {
      color: #6d6d6d;
    }

    .composer-textarea:focus {
      outline: none;
    }

    .attachment-preview {
      margin: 0 28px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
      display: none;
      position: relative;
    }

    .attachment-preview.visible {
      display: block;
    }

    .attachment-preview.image-preview {
      border: 0;
      background: transparent;
    }

    .attachment-image {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    .attachment-file {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 34px;
      gap: 10px;
      align-items: center;
      padding: 12px;
    }

    .attachment-icon {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: #e8f2fc;
      color: var(--brand);
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .attachment-remove {
      width: 34px;
      min-height: 34px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 22px;
    }

    .image-remove {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, .62);
      color: white;
      border-radius: 50%;
    }

    .file-input {
      display: none;
    }

    .composer-tools {
      padding: 6px 28px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .tool-button {
      width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #666;
      display: grid;
      place-items: center;
      font-size: 25px;
      position: relative;
    }

    .tool-button.active {
      color: var(--brand);
      background: #e8f2fc;
      border-radius: 50%;
    }

    .tool-button .tool-label {
      position: absolute;
      left: 50%;
      top: 38px;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--muted);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    .tool-button:hover .tool-label {
      opacity: 1;
    }

    .planner-strip {
      border-top: 1px solid var(--line);
      padding: 14px 20px;
      background: #f8fafc;
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
    }

    .planner-strip .field {
      margin-bottom: 0;
    }

    .planner-strip label {
      font-size: 11px;
    }

    .planner-strip input,
    .planner-strip select {
      min-height: 36px;
      padding: 7px 8px;
      font-size: 13px;
    }

    .composer-footer-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .schedule-icon {
      width: 28px;
      height: 28px;
      border: 2px solid #5e646a;
      border-radius: 50%;
      position: relative;
      display: inline-block;
    }

    .schedule-icon::before,
    .schedule-icon::after {
      content: "";
      position: absolute;
      background: #5e646a;
      left: 12px;
      top: 6px;
      width: 2px;
      height: 8px;
      transform-origin: bottom;
    }

    .schedule-icon::after {
      top: 13px;
      width: 8px;
      height: 2px;
    }

    .danger {
      color: var(--red);
      border-color: #f1b8b2;
    }

    .actions-right {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    @media (max-width: 860px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        justify-content: flex-start;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .stats {
        margin-top: 0;
      }

      .drawer {
        width: min(720px, calc(100vw - 18px));
        height: min(780px, calc(100vh - 18px));
      }

      .planner-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .sidebar {
        grid-template-columns: 1fr;
      }

      .calendar-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .month-title h2 {
        font-size: 21px;
      }

      .view-toggle {
        width: 100%;
      }

      .view-toggle button {
        flex: 1;
      }

      .composer-textarea {
        min-height: 230px;
        font-size: 21px;
        padding: 18px;
      }

      .attachment-preview {
        margin: 0 18px 12px;
      }

      .composer-tools {
        padding: 4px 18px 16px;
        gap: 10px;
      }

      .planner-strip {
        grid-template-columns: 1fr;
      }

      .drawer-actions {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">in</div>
        <div>
          <h1>LinkedIn Post Planner</h1>
          <div class="subtle">Plan, schrijf en bewaak je contentritme</div>
        </div>
      </div>
      <div class="toolbar">
        <button class="icon-button" id="prevBtn" title="Vorige periode" aria-label="Vorige periode">&lt;</button>
        <button id="todayBtn">Vandaag</button>
        <button class="icon-button" id="nextBtn" title="Volgende periode" aria-label="Volgende periode">&gt;</button>
        <button class="primary" id="newPostBtn">Nieuwe post</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <section>
          <h2>Overzicht</h2>
          <div class="stats">
            <div class="stat">
              <strong id="monthCount">0</strong>
              <span class="subtle">deze maand</span>
            </div>
            <div class="stat">
              <strong id="readyCount">0</strong>
              <span class="subtle">klaar</span>
            </div>
          </div>
          <div class="field">
            <label for="searchInput">Zoeken</label>
            <input id="searchInput" placeholder="Onderwerp, hook of tekst">
          </div>
        </section>

        <section>
          <h2>Status</h2>
          <div class="filters" id="filters">
            <button class="chip active" data-filter="all"><span class="dot"></span>Alles</button>
            <button class="chip" data-filter="idea"><span class="dot idea"></span>Idee</button>
            <button class="chip" data-filter="draft"><span class="dot draft"></span>Concept</button>
            <button class="chip" data-filter="ready"><span class="dot ready"></span>Klaar</button>
            <button class="chip" data-filter="posted"><span class="dot posted"></span>Geplaatst</button>
          </div>
        </section>
      </aside>

      <main class="main">
        <div class="calendar-head">
          <div class="month-title">
            <h2 id="periodTitle">Maand</h2>
            <span class="subtle" id="periodHint"></span>
          </div>
          <div class="view-toggle" role="group" aria-label="Weergave">
            <button id="monthViewBtn" class="active">Maand</button>
            <button id="weekViewBtn">Week</button>
          </div>
        </div>
        <div class="calendar-wrap" id="calendarRoot"></div>
      </main>
    </div>
  </div>

  <div class="drawer-backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <form id="postForm" class="drawer-body">
      <input type="hidden" id="postId">
      <input type="hidden" id="postMedia" value="tekst">
      <input type="file" id="photoInput" class="file-input" accept="image/png,image/jpeg,image/webp,image/gif">
      <input type="file" id="documentInput" class="file-input" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.csv,.txt,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation">
      <div class="composer">
        <div class="composer-top">
          <button type="button" class="composer-close" id="closeDrawerBtn" title="Sluiten" aria-label="Sluiten">x</button>
        </div>

        <textarea id="postText" class="composer-textarea" placeholder="Waar wilt u het over hebben?"></textarea>

        <div id="attachmentPreview" class="attachment-preview" aria-live="polite"></div>

        <div class="composer-tools" aria-label="LinkedIn opties">
          <button type="button" class="tool-button active" data-media="tekst" title="Alleen tekst" aria-label="Alleen tekst">
            Aa<span class="tool-label">Tekst</span>
          </button>

  <!--
    Supabase setup voor gedeelde agenda:

    1. Maak in Supabase een tabel met deze SQL:

    create table if not exists public.linkedin_posts (
      id uuid primary key,
      title text not null default '',
      date date not null,
      time text,
      type text,
      media text,
      attachment jsonb,
      status text,
      hook text,
      text text,
      goal text,
      updated_at timestamptz not null default now()
    );

    alter table public.linkedin_posts enable row level security;

    -- Simpel delen zonder login. Alleen gebruiken als deze planner niet publiek bedoeld is.
    create policy "Iedereen mag posts lezen"
      on public.linkedin_posts for select
      using (true);

    create policy "Iedereen mag posts toevoegen"
      on public.linkedin_posts for insert
      with check (true);

    create policy "Iedereen mag posts aanpassen"
      on public.linkedin_posts for update
      using (true)
      with check (true);

    create policy "Iedereen mag posts verwijderen"
      on public.linkedin_posts for delete
      using (true);

    2. Ga in Supabase naar Project Settings > API.
    3. Kopieer de Project URL en anon public key.
    4. Vul ze hieronder in bij supabaseConfig.

    Zet je Postgres connection string of database password nooit in deze HTML.
    Alles in een HTML-bestand is zichtbaar voor bezoekers.
  -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const storageKey = "linkedin-post-planner-v1";
    const supabaseConfig = {
  url: "https://husduywspstzzuasafpn.supabase.co",
  anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1c2R1eXdzcHN0enp1YXNhZnBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5MzQ4MTksImV4cCI6MjA5OTUxMDgxOX0.xLa_vFZZXDnGensthB5BBNU2n6ypHmV3gohcA-30iRA",
  table: "linkedin_posts"
};
    const monthNames = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
    const weekdays = ["Ma", "Di", "Wo", "Do", "Vr", "Za", "Zo"];
    const statusLabels = { idea: "Idee", draft: "Concept", ready: "Klaar", posted: "Geplaatst" };
    const mediaLabels = { tekst: "Tekst", foto: "Foto", document: "Document", event: "Event", celebrate: "Vieren", meer: "Meer" };
    const mediaIcons = { tekst: "Aa", foto: "▧", document: "▤", event: "▦", celebrate: "✹", meer: "+" };
    const maxAttachmentSize = 3 * 1024 * 1024;

    let posts = loadPosts();
    let cursor = new Date();
    let view = "month";
    let filter = "all";
    let currentAttachment = null;
    let supabaseClient = null;
    let remoteReady = false;

    const root = document.getElementById("calendarRoot");
    const periodTitle = document.getElementById("periodTitle");
    const periodHint = document.getElementById("periodHint");
    const monthCount = document.getElementById("monthCount");
    const readyCount = document.getElementById("readyCount");
    const searchInput = document.getElementById("searchInput");
    const drawer = document.getElementById("drawer");
    const backdrop = document.getElementById("backdrop");
    const form = document.getElementById("postForm");
    const photoInput = document.getElementById("photoInput");
    const documentInput = document.getElementById("documentInput");
    const attachmentPreview = document.getElementById("attachmentPreview");

    document.getElementById("prevBtn").addEventListener("click", () => movePeriod(-1));
    document.getElementById("nextBtn").addEventListener("click", () => movePeriod(1));
    document.getElementById("todayBtn").addEventListener("click", () => { cursor = new Date(); render(); });
    document.getElementById("newPostBtn").addEventListener("click", () => openEditor({ date: toDateInput(new Date()) }));
    document.getElementById("monthViewBtn").addEventListener("click", () => setView("month"));
    document.getElementById("weekViewBtn").addEventListener("click", () => setView("week"));
    document.getElementById("closeDrawerBtn").addEventListener("click", closeEditor);
    document.getElementById("cancelBtn").addEventListener("click", closeEditor);
    document.getElementById("saveBtn").addEventListener("click", savePost);
    document.getElementById("deleteBtn").addEventListener("click", deletePost);
    backdrop.addEventListener("click", closeEditor);
    searchInput.addEventListener("input", render);
    form.addEventListener("submit", event => {
      event.preventDefault();
      savePost();
    });
    document.querySelectorAll("[data-media]").forEach(button => {
      button.addEventListener("click", () => handleMediaChoice(button.dataset.media));
    });
    photoInput.addEventListener("change", () => handleFileSelection(photoInput, "foto"));
    documentInput.addEventListener("change", () => handleFileSelection(documentInput, "document"));
    ["postDate", "postTime"].forEach(id => {
      document.getElementById(id).addEventListener("input", updateScheduleSummary);
    });

    document.getElementById("filters").addEventListener("click", (event) => {
      const button = event.target.closest("[data-filter]");
      if (!button) return;
      filter = button.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach(item => item.classList.toggle("active", item === button));
      render();
    });

    render();
    initSupabase();

    function loadPosts() {
  const saved = localStorage.getItem(storageKey);

  if (saved) {
    try {
      return JSON.parse(saved);
    } catch (error) {
      console.warn("Lokale planning kon niet worden gelezen:", error);
    }
  }

  return [];
}

    function savePosts() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(posts));
        return true;
      } catch (error) {
        alert("Opslaan lukt niet omdat de browseropslag vol zit. Verwijder een grote bijlage of kies een kleiner bestand.");
        return false;
      }
    }

    async function initSupabase() {
      const hasConfig = supabaseConfig.url && supabaseConfig.anonKey && !supabaseConfig.anonKey.includes("PASTE_YOUR");
      if (!hasConfig || !window.supabase) return;

      supabaseClient = window.supabase.createClient(supabaseConfig.url, supabaseConfig.anonKey);
      const loaded = await loadRemotePosts();
      if (!loaded) return;

      remoteReady = true;
      supabaseClient
        .channel("linkedin-posts-calendar")
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: supabaseConfig.table },
          () => loadRemotePosts()
        )
        .subscribe();
    }

    async function loadRemotePosts() {
      if (!supabaseClient) return false;
      const { data, error } = await supabaseClient
        .from(supabaseConfig.table)
        .select("*")
        .order("date", { ascending: true })
        .order("time", { ascending: true });

      if (error) {
        console.warn("Supabase laden mislukt:", error.message);
        return false;
      }

      posts = (data || []).map(rowToPost);
      savePosts();
      render();
      return true;
    }

    async function upsertRemotePost(post) {
      if (!remoteReady || !supabaseClient) return;
      const { error } = await supabaseClient
        .from(supabaseConfig.table)
        .upsert(postToRow(post), { onConflict: "id" });

      if (error) {
        alert(`Opslaan in Supabase lukte niet: ${error.message}`);
      }
    }

    async function deleteRemotePost(id) {
      if (!remoteReady || !supabaseClient) return;
      const { error } = await supabaseClient
        .from(supabaseConfig.table)
        .delete()
        .eq("id", id);

      if (error) {
        alert(`Verwijderen in Supabase lukte niet: ${error.message}`);
      }
    }

    function postToRow(post) {
      return {
        id: post.id,
        title: post.title,
        date: post.date,
        time: post.time,
        type: post.type,
        media: post.media,
        attachment: post.attachment,
        status: post.status,
        hook: post.hook,
        text: post.text,
        goal: post.goal,
        updated_at: new Date().toISOString()
      };
    }

    function rowToPost(row) {
      return {
        id: row.id,
        title: row.title || "",
        date: row.date,
        time: row.time || "",
        type: row.type || "Thought leadership",
        media: row.media || "tekst",
        attachment: row.attachment || null,
        status: row.status || "idea",
        hook: row.hook || "",
        text: row.text || "",
        goal: row.goal || "Zichtbaarheid"
      };
    }

    function render() {
      if (view === "month") renderMonth();
      else renderWeek();
      renderStats();
    }

    function renderStats() {
      const month = cursor.getMonth();
      const year = cursor.getFullYear();
      const monthPosts = posts.filter(post => {
        const date = parseLocalDate(post.date);
        return date.getMonth() === month && date.getFullYear() === year;
      });
      monthCount.textContent = monthPosts.length;
      readyCount.textContent = monthPosts.filter(post => post.status === "ready").length;
    }

    function renderMonth() {
      const year = cursor.getFullYear();
      const month = cursor.getMonth();
      periodTitle.textContent = `${capitalize(monthNames[month])} ${year}`;
      periodHint.textContent = "Maandoverzicht";

      const first = new Date(year, month, 1);
      const start = startOfWeek(first);
      const days = Array.from({ length: 42 }, (_, index) => addDays(start, index));
      const todayKey = toDateInput(new Date());

      root.innerHTML = `
        <section class="calendar">
          <div class="weekdays">${weekdays.map(day => `<div>${day}</div>`).join("")}</div>
          <div class="month-grid">
            ${days.map(day => renderDay(day, month, todayKey)).join("")}
          </div>
        </section>
      `;

      root.querySelectorAll("[data-add-date]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          openEditor({ date: button.dataset.addDate });
        });
      });

      root.querySelectorAll("[data-post-id]").forEach(card => {
        card.addEventListener("click", () => openEditor(posts.find(post => post.id === card.dataset.postId)));
      });
    }

    function renderDay(day, activeMonth, todayKey) {
      const dateKey = toDateInput(day);
      const dayPosts = filteredPosts().filter(post => post.date === dateKey).sort(sortByTime);
      const outside = day.getMonth() !== activeMonth ? " outside" : "";
      const today = dateKey === todayKey ? " today" : "";
      return `
        <div class="day${outside}${today}">
          <div class="day-top">
            <span class="day-number">${day.getDate()}</span>
            <button class="mini-add" data-add-date="${dateKey}" title="Post toevoegen" aria-label="Post toevoegen">+</button>
          </div>
          ${dayPosts.map(renderPostCard).join("")}
        </div>
      `;
    }

    function renderWeek() {
      const start = startOfWeek(cursor);
      const days = Array.from({ length: 7 }, (_, index) => addDays(start, index));
      const end = days[6];
      periodTitle.textContent = `${start.getDate()} ${monthNames[start.getMonth()]} - ${end.getDate()} ${monthNames[end.getMonth()]}`;
      periodHint.textContent = "Weekoverzicht";

      root.innerHTML = `
        <section class="week-list">
          ${days.map(day => {
            const dateKey = toDateInput(day);
            const dayPosts = filteredPosts().filter(post => post.date === dateKey).sort(sortByTime);
            return `
              <div class="week-row">
                <div class="week-date">
                  <span class="subtle">${weekdays[(day.getDay() + 6) % 7]}</span>
                  <strong>${day.getDate()} ${monthNames[day.getMonth()]}</strong>
                  <button data-add-date="${dateKey}">Toevoegen</button>
                </div>
                <div class="week-posts">
                  ${dayPosts.length ? dayPosts.map(renderPostCard).join("") : `<div class="empty">Nog niets gepland</div>`}
                </div>
              </div>
            `;
          }).join("")}
        </section>
      `;

      root.querySelectorAll("[data-add-date]").forEach(button => {
        button.addEventListener("click", () => openEditor({ date: button.dataset.addDate }));
      });

      root.querySelectorAll("[data-post-id]").forEach(card => {
        card.addEventListener("click", () => openEditor(posts.find(post => post.id === card.dataset.postId)));
      });
    }

    function renderPostCard(post) {
      const title = escapeHtml(post.title || "Zonder titel");
      const copy = escapeHtml(post.text || post.hook || "Nog geen tekst. Open deze post om de inhoud te schrijven.");
      const media = post.media || "tekst";
      const mediaBlock = renderMediaBlock(post, media);
      return `
        <article class="post ${post.status}" data-post-id="${post.id}" tabindex="0">
          <div class="post-author">
            <div class="avatar">RR</div>
            <div>
              <div class="author-name">Ruben Rijkse</div>
              <div class="audience-line">${post.time || "--:--"} · Iedereen</div>
            </div>
          </div>
          <div class="post-copy">${copy}</div>
          ${mediaBlock}
          <div class="post-title">${title}</div>
          <div class="post-meta">
            <span class="dot ${post.status}"></span>
            <span>${statusLabels[post.status]}</span>
            <span>·</span>
            <span>${escapeHtml(post.type || "Post")}</span>
          </div>
        </article>
      `;
    }

    function filteredPosts() {
      const query = searchInput.value.trim().toLowerCase();
      return posts.filter(post => {
        const matchesFilter = filter === "all" || post.status === filter;
        const haystack = [post.title, post.type, post.hook, post.text, post.goal, post.media].join(" ").toLowerCase();
        return matchesFilter && (!query || haystack.includes(query));
      });
    }

    function openEditor(post) {
      const editing = Boolean(post.id);
      document.getElementById("postId").value = post.id || "";
      document.getElementById("postTitle").value = post.title || "";
      document.getElementById("postDate").value = post.date || toDateInput(new Date());
      document.getElementById("postTime").value = post.time || "09:00";
      document.getElementById("postType").value = post.type || "Thought leadership";
      currentAttachment = post.attachment || null;
      setMedia(post.media || "tekst");
      renderAttachmentPreview();
      document.getElementById("postStatus").value = post.status || "idea";
      document.getElementById("postHook").value = post.hook || "";
      document.getElementById("postText").value = post.text || "";
      document.getElementById("postGoal").value = post.goal || "Zichtbaarheid";
      document.getElementById("deleteBtn").style.visibility = editing ? "visible" : "hidden";
      updateScheduleSummary();
      drawer.classList.add("open");
      backdrop.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      document.getElementById("postText").focus();
    }

    function closeEditor() {
      drawer.classList.remove("open");
      backdrop.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
      form.reset();
      currentAttachment = null;
      renderAttachmentPreview();
    }

    function savePost() {
      if (!form.reportValidity()) return;
      const id = document.getElementById("postId").value || crypto.randomUUID();
      const post = {
        id,
        title: document.getElementById("postTitle").value.trim(),
        date: document.getElementById("postDate").value,
        time: document.getElementById("postTime").value,
        type: document.getElementById("postType").value,
        media: document.getElementById("postMedia").value,
        attachment: currentAttachment,
        status: document.getElementById("postStatus").value,
        hook: document.getElementById("postHook").value.trim(),
        text: document.getElementById("postText").value.trim(),
        goal: document.getElementById("postGoal").value
      };

      const index = posts.findIndex(item => item.id === id);
      if (index >= 0) posts[index] = post;
      else posts.push(post);
      if (savePosts()) {
        upsertRemotePost(post);
        closeEditor();
        render();
      }
    }

    function deletePost() {
      const id = document.getElementById("postId").value;
      if (!id) return;
      posts = posts.filter(post => post.id !== id);
      if (savePosts()) {
        deleteRemotePost(id);
        closeEditor();
        render();
      }
    }

    function movePeriod(direction) {
      if (view === "month") cursor = new Date(cursor.getFullYear(), cursor.getMonth() + direction, 1);
      else cursor = addDays(cursor, direction * 7);
      render();
    }

    function setView(nextView) {
      view = nextView;
      document.getElementById("monthViewBtn").classList.toggle("active", view === "month");
      document.getElementById("weekViewBtn").classList.toggle("active", view === "week");
      render();
    }

    function setMedia(media) {
      document.getElementById("postMedia").value = media;
      document.querySelectorAll("[data-media]").forEach(button => {
        button.classList.toggle("active", button.dataset.media === media);
      });
    }

    function handleMediaChoice(media) {
      setMedia(media);
      if (media === "foto") {
        photoInput.value = "";
        photoInput.click();
      } else if (media === "document") {
        documentInput.value = "";
        documentInput.click();
      } else if (media !== "foto" && media !== "document") {
        currentAttachment = null;
        renderAttachmentPreview();
      }
    }

    function handleFileSelection(input, media) {
      const file = input.files && input.files[0];
      if (!file) return;
      if (file.size > maxAttachmentSize) {
        alert("Dit bestand is groter dan 3 MB. Kies een kleinere versie, zodat de planner snel blijft.");
        input.value = "";
        return;
      }

      const reader = new FileReader();
      reader.addEventListener("load", () => {
        currentAttachment = {
          name: file.name,
          type: file.type || "application/octet-stream",
          size: file.size,
          dataUrl: reader.result
        };
        setMedia(media);
        renderAttachmentPreview();
      });
      reader.readAsDataURL(file);
    }

    function renderAttachmentPreview() {
      if (!currentAttachment) {
        attachmentPreview.classList.remove("visible");
        attachmentPreview.classList.remove("image-preview");
        attachmentPreview.innerHTML = "";
        return;
      }

      attachmentPreview.classList.add("visible");
      attachmentPreview.classList.toggle("image-preview", (currentAttachment.type || "").startsWith("image/"));
      if ((currentAttachment.type || "").startsWith("image/")) {
        attachmentPreview.innerHTML = `
          <img class="attachment-image" src="${currentAttachment.dataUrl}" alt="${escapeHtml(currentAttachment.name)}">
          <button type="button" class="attachment-remove image-remove js-remove-attachment" aria-label="Bijlage verwijderen">x</button>
        `;
      } else {
        attachmentPreview.innerHTML = `
          <div class="attachment-file">
            <div class="attachment-icon">DOC</div>
            <div>
              <div class="attachment-name">${escapeHtml(currentAttachment.name)}</div>
              <div class="attachment-meta">${formatBytes(currentAttachment.size)}</div>
            </div>
            <button type="button" class="attachment-remove js-remove-attachment" aria-label="Bijlage verwijderen">x</button>
          </div>
        `;
      }

      attachmentPreview.querySelector(".js-remove-attachment").addEventListener("click", () => {
        currentAttachment = null;
        setMedia("tekst");
        renderAttachmentPreview();
      });
    }

    function renderMediaBlock(post, media) {
      const attachment = post.attachment;
      if (attachment && (attachment.type || "").startsWith("image/")) {
        return `<div class="post-media image-media"><img src="${attachment.dataUrl}" alt="${escapeHtml(attachment.name)}"></div>`;
      }
      if (attachment) {
        return `
          <div class="post-media">
            <div class="post-document">
              <span>${mediaIcons.document}</span>
              <div>
                <strong>${escapeHtml(attachment.name)}</strong>
                <small>${formatBytes(attachment.size)}</small>
              </div>
            </div>
          </div>
        `;
      }
      return media === "tekst" ? "" : `<div class="post-media">${mediaIcons[media] || "+"} ${mediaLabels[media] || "Media"}</div>`;
    }

    function updateScheduleSummary() {
      const dateValue = document.getElementById("postDate").value;
      const timeValue = document.getElementById("postTime").value;
      const summary = document.getElementById("scheduleSummary");
      if (!dateValue) {
        summary.textContent = "Nog niet gepland";
        return;
      }
      const date = parseLocalDate(dateValue);
      summary.textContent = `${date.getDate()} ${monthNames[date.getMonth()]} om ${timeValue || "--:--"}`;
    }

    function startOfWeek(date) {
      const copy = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const day = (copy.getDay() + 6) % 7;
      copy.setDate(copy.getDate() - day);
      return copy;
    }

    function addDays(date, amount) {
      const copy = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      copy.setDate(copy.getDate() + amount);
      return copy;
    }

    function toDateInput(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function parseLocalDate(value) {
      const [year, month, day] = value.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function sortByTime(a, b) {
      return (a.time || "").localeCompare(b.time || "");
    }

    function formatBytes(bytes) {
      if (!bytes) return "0 KB";
      const units = ["B", "KB", "MB"];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value = value / 1024;
        unit += 1;
      }
      return `${value.toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
    }

    function capitalize(value) {
      return value.charAt(0).toUpperCase() + value.slice(1);
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[character]));
    }
  </script>
