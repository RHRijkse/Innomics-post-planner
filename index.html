<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkedIn Post Planner</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #5b6773;
      --line: #d9e1e8;
      --soft: #f3f6f8;
      --panel: #ffffff;
      --brand: #0a66c2;
      --brand-dark: #084d92;
      --green: #16764f;
      --yellow: #a15d00;
      --red: #b42318;
      --shadow: 0 12px 30px rgba(17, 35, 52, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #eef3f7;
      overflow: hidden;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      min-height: 38px;
      border-radius: 6px;
      padding: 0 12px;
      cursor: pointer;
    }

    button:hover { border-color: #aebdca; }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 22px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: var(--brand);
      color: white;
      font-weight: 800;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .subtle {
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .app-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }

    .app-nav button {
      min-height: 32px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .app-nav button.active {
      background: white;
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(17, 35, 52, .09);
    }

    .page-view {
      display: none;
      min-height: 0;
      overflow: hidden;
    }

    .page-view.active.layout {
      display: grid;
    }

    .page-view.active.ideas-page {
      display: grid;
    }

    .primary {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
      font-weight: 700;
    }

    .primary:hover {
      background: var(--brand-dark);
      border-color: var(--brand-dark);
    }

    .icon-button {
      width: 40px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      font-weight: 800;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 0;
      overflow: hidden;
    }

    .ideas-page {
      grid-template-columns: 280px minmax(0, 1fr);
      background: #e9eef3;
    }

    .ideas-sidebar {
      min-height: 0;
      padding: 18px;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: #f8fafc;
    }

    .ideas-sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .ideas-sidebar h2 {
      margin: 0;
      font-size: 16px;
    }

    .ideas-list {
      display: grid;
      gap: 7px;
    }

    .idea-document-item {
      width: 100%;
      min-height: 66px;
      padding: 10px 11px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 30px;
      align-items: center;
      gap: 8px;
      text-align: left;
      background: white;
    }

    .idea-document-item.active {
      border-color: var(--brand);
      box-shadow: inset 3px 0 0 var(--brand);
    }

    .idea-document-title {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 800;
    }

    .idea-document-date {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .idea-document-delete {
      width: 30px;
      min-height: 30px;
      padding: 0;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 18px;
    }

    .idea-document-delete:hover {
      color: var(--red);
      background: #fff1f0;
    }

    .ideas-empty-list {
      padding: 14px 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .idea-editor-shell {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    .idea-formatbar {
      min-height: 58px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      background: white;
      z-index: 2;
    }

    .idea-formatbar button,
    .idea-formatbar select {
      min-height: 34px;
      width: auto;
      padding: 0 10px;
      background: white;
    }

    .idea-formatbar button {
      min-width: 36px;
      font-weight: 800;
    }

    .idea-save-status {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
    }

    .idea-workspace {
      min-height: 0;
      overflow: auto;
      padding: 36px;
      background: #e9eef3;
    }

    .idea-paper {
      width: min(820px, 100%);
      min-height: calc(100vh - 190px);
      margin: 0 auto;
      padding: 64px 76px 90px;
      border: 1px solid #dfe5eb;
      background: white;
      box-shadow: 0 18px 45px rgba(17, 35, 52, .12);
    }

    .idea-title-input {
      min-height: 52px;
      padding: 0 0 16px;
      border: 0;
      border-bottom: 1px solid #e7ebef;
      border-radius: 0;
      font-size: 32px;
      font-weight: 800;
      line-height: 1.15;
    }

    .idea-title-input:focus {
      outline: none;
      border-bottom-color: var(--brand);
    }

    .idea-content {
      min-height: 560px;
      padding-top: 26px;
      color: #202832;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.65;
      outline: none;
    }

    .idea-content:empty::before {
      content: "Schrijf hier je ideeën. Gebruik koppen en lijsten om alles geordend te houden...";
      color: #9aa5af;
      pointer-events: none;
    }

    .idea-content h2 {
      margin: 1.3em 0 .45em;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 24px;
      line-height: 1.25;
    }

    .idea-content p {
      margin: 0 0 1em;
    }

    .idea-content ul,
    .idea-content ol {
      padding-left: 28px;
    }

    .idea-empty-editor {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 30px;
      color: var(--muted);
      text-align: center;
    }

    .idea-empty-editor div {
      max-width: 360px;
    }

    .idea-delete-toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 45;
      min-width: 290px;
      padding: 11px 12px 11px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-radius: 8px;
      background: #17212b;
      color: white;
      box-shadow: 0 14px 36px rgba(0, 0, 0, .24);
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }

    .idea-delete-toast.visible {
      transform: translate(-50%, 0);
      opacity: 1;
      pointer-events: auto;
    }

    .idea-delete-toast button {
      min-height: 32px;
      border-color: rgba(255, 255, 255, .28);
      background: transparent;
      color: white;
      font-weight: 800;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: #f8fafc;
      padding: 18px;
      overflow: auto;
    }

    .sidebar h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin: 4px 0 10px;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: white;
      border-radius: 6px;
      padding: 9px 10px;
      color: var(--ink);
      min-height: 38px;
    }

    textarea {
      min-height: 118px;
      resize: vertical;
      line-height: 1.45;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 16px 0;
    }

    .stat {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .filters {
      display: grid;
      gap: 8px;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      justify-content: flex-start;
      border-radius: 999px;
      background: white;
    }

    .chip.active {
      border-color: var(--brand);
      box-shadow: inset 0 0 0 1px var(--brand);
      color: var(--brand-dark);
      font-weight: 700;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 99px;
      background: var(--muted);
      flex: 0 0 auto;
    }

    .dot.idea { background: #6772e5; }
    .dot.draft { background: var(--yellow); }
    .dot.ready { background: var(--green); }
    .dot.posted { background: #59636e; }

    .main {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px 12px;
      background: #eef3f7;
    }

    .month-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .month-title h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .view-toggle {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: white;
    }

    .view-toggle button {
      border: 0;
      border-radius: 0;
      min-width: 72px;
    }

    .view-toggle button.active {
      background: var(--ink);
      color: white;
      font-weight: 700;
    }

    .calendar-wrap {
      padding: 0 20px 20px;
      overflow: auto;
    }

    .calendar {
      min-width: 760px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .weekdays, .month-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekdays div {
      padding: 11px 10px;
      background: #f8fafc;
      border-right: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 800;
    }

    .weekdays div:last-child { border-right: 0; }

    .day {
      min-height: 210px;
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 8px;
      background: white;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .day:nth-child(7n) { border-right: 0; }

    .day.outside {
      background: #f7f9fb;
      color: #8b98a6;
    }

    .day.today {
      box-shadow: inset 0 0 0 2px var(--brand);
    }

    .day-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      min-height: 24px;
    }

    .day-number {
      font-weight: 800;
      font-size: 13px;
    }

    .mini-add {
      width: 26px;
      height: 26px;
      min-height: 26px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 0;
    }

    .mini-add:hover {
      background: var(--soft);
      color: var(--brand);
    }

    .post {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      display: grid;
      gap: 7px;
      cursor: pointer;
      background: #fff;
      min-height: 126px;
      box-shadow: 0 4px 12px rgba(17, 35, 52, .05);
    }

    .post:hover {
      border-color: #9db7cf;
    }

    .post.idea { box-shadow: inset 4px 0 0 #6772e5, 0 4px 12px rgba(17, 35, 52, .05); }
    .post.draft { box-shadow: inset 4px 0 0 var(--yellow), 0 4px 12px rgba(17, 35, 52, .05); }
    .post.ready { box-shadow: inset 4px 0 0 var(--green), 0 4px 12px rgba(17, 35, 52, .05); }
    .post.posted { box-shadow: inset 4px 0 0 #59636e, 0 4px 12px rgba(17, 35, 52, .05); }

    .post-title {
      font-weight: 800;
      font-size: 12px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .post-copy {
      color: #27323d;
      font-size: 12px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-line;
    }

    .post-media {
      border: 1px solid #d9e1e8;
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      overflow: hidden;
    }

    .post-media.image-media {
      display: block;
      border: 0;
      border-radius: 8px;
      background: transparent;
    }

    .post-media img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    .post-document {
      width: 100%;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 7px;
      align-items: center;
      padding: 10px;
      text-align: left;
    }

    .attachment-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .post-document strong {
      display: block;
      overflow-wrap: anywhere;
      white-space: normal;
      line-height: 1.2;
    }

    .post-document small,
    .attachment-meta {
      color: var(--muted);
      font-weight: 500;
    }

    .post-meta {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      gap: 6px;
      align-items: center;
      min-width: 0;
    }

    .week-list {
      min-width: 720px;
      display: grid;
      gap: 10px;
    }

    .week-row {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .week-date {
      border-right: 1px solid var(--line);
      padding-right: 12px;
    }

    .week-date strong {
      display: block;
      font-size: 18px;
    }

    .week-posts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px;
      align-content: start;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 9px 0;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(14, 28, 42, .42);
      display: none;
      z-index: 20;
    }

    .drawer-backdrop.open { display: block; }

    .drawer {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(920px, calc(100vw - 28px));
      height: min(760px, calc(100vh - 28px));
      background: white;
      border-radius: 10px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .26);
      z-index: 30;
      transform: translate(-50%, -46%) scale(.98);
      opacity: 0;
      transition: transform .18s ease;
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
      pointer-events: none;
    }

    .drawer.open {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .drawer header {
      padding: 0;
      border-bottom: 0;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .drawer h2 {
      margin: 0;
      font-size: 20px;
    }

    .drawer-body {
      padding: 0;
      overflow: auto;
    }

    .drawer-actions {
      border-top: 1px solid var(--line);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      background: #fff;
    }

    .composer {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
    }

    .composer-top {
      padding: 14px 18px 0;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 12px;
    }

    .composer-close {
      border: 0;
      width: 42px;
      height: 42px;
      min-height: 42px;
      font-size: 32px;
      font-weight: 300;
      color: #333;
      background: transparent;
    }

    .composer-textarea {
      border: 0;
      border-radius: 0;
      min-height: 270px;
      resize: none;
      font-size: 26px;
      line-height: 1.35;
      padding: 24px 28px;
      color: #222;
    }

    .composer-textarea::placeholder {
      color: #6d6d6d;
    }

    .composer-textarea:focus {
      outline: none;
    }

    .attachment-preview {
      margin: 0 28px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
      display: none;
      position: relative;
    }

    .attachment-preview.visible {
      display: block;
    }

    .attachment-preview.image-preview {
      border: 0;
      background: transparent;
    }

    .attachment-image {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    .attachment-file {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 34px;
      gap: 10px;
      align-items: center;
      padding: 12px;
    }

    .attachment-icon {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: #e8f2fc;
      color: var(--brand);
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .attachment-remove {
      width: 34px;
      min-height: 34px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 22px;
    }

    .image-remove {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, .62);
      color: white;
      border-radius: 50%;
    }

    .file-input {
      display: none;
    }

    .composer-tools {
      padding: 6px 28px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .tool-button {
      width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #666;
      display: grid;
      place-items: center;
      font-size: 25px;
      position: relative;
    }

    .tool-button.active {
      color: var(--brand);
      background: #e8f2fc;
      border-radius: 50%;
    }

    .tool-button .tool-label {
      position: absolute;
      left: 50%;
      top: 38px;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--muted);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    .tool-button:hover .tool-label {
      opacity: 1;
    }

    .planner-strip {
      border-top: 1px solid var(--line);
      padding: 14px 20px;
      background: #f8fafc;
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 10px;
    }

    .planner-strip .field {
      margin-bottom: 0;
    }

    .planner-strip label {
      font-size: 11px;
    }

    .planner-strip input,
    .planner-strip select,
    .planner-strip textarea {
      min-height: 36px;
      padding: 7px 8px;
      font-size: 13px;
    }

    .planner-strip .feedback-field {
      grid-column: 1 / -1;
      margin-top: 2px;
    }

    .planner-strip .feedback-field textarea {
      min-height: 88px;
    }

    .composer-footer-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .schedule-icon {
      width: 28px;
      height: 28px;
      border: 2px solid #5e646a;
      border-radius: 50%;

    @media (max-width: 560px) {

<body>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>

  url: "https://husduywspstzzuasafpn.supabase.co",
  anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1c2R1eXdzcHN0enp1YXNhZnBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5MzQ4MTksImV4cCI6MjA5OTUxMDgxOX0.xLa_vFZZXDnGensthB5BBNU2n6ypHmV3gohcA-30iRA",
  table: "linkedin_posts"
};
    const monthNames = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
    const weekdays = ["Ma", "Di", "Wo", "Do", "Vr", "Za", "Zo"];
    const statusLabels = { idea: "Idee", draft: "Concept", ready: "Klaar", posted: "Geplaatst" };
    const mediaLabels = { tekst: "Tekst", foto: "Foto", document: "Document", event: "Event", celebrate: "Vieren" };
    const mediaIcons = { tekst: "Aa", foto: "▧", document: "▤", event: "▦", celebrate: "✹" };
    const maxAttachmentSize = 10 * 1024 * 1024;

    let posts = loadPosts();
    let ideaDocuments = loadIdeaDocuments();
    let deletedIdeaIds = new Set(loadDeletedIdeaIds());
    ideaDocuments = ideaDocuments.filter(item => !deletedIdeaIds.has(item.id));
    let activeIdeaId = localStorage.getItem(activeIdeaStorageKey) || ideaDocuments[0]?.id || "";
    let cursor = new Date();
    let view = "month";
    let filter = "all";
    let currentAttachment = null;
    let supabaseClient = null;
    let remoteReady = false;

    let pendingIdeaSync = [];
    let recentlyDeletedIdea = null;
    let ideaToastTimer = null;

    const root = document.getElementById("calendarRoot");
    const periodTitle = document.getElementById("periodTitle");
    const periodHint = document.getElementById("periodHint");
    const monthCount = document.getElementById("monthCount");
    const readyCount = document.getElementById("readyCount");
    const searchInput = document.getElementById("searchInput");
    const drawer = document.getElementById("drawer");
    const backdrop = document.getElementById("backdrop");
    const form = document.getElementById("postForm");
    const photoInput = document.getElementById("photoInput");
    const documentInput = document.getElementById("documentInput");
    const attachmentPreview = document.getElementById("attachmentPreview");
    const plannerPage = document.getElementById("plannerPage");
    const ideasPage = document.getElementById("ideasPage");
    const ideasList = document.getElementById("ideasList");
    const ideaCount = document.getElementById("ideaCount");
    const ideaPaper = document.getElementById("ideaPaper");
    const ideaEmptyEditor = document.getElementById("ideaEmptyEditor");
    const ideaTitle = document.getElementById("ideaTitle");
    const ideaContent = document.getElementById("ideaContent");
    const ideaSaveStatus = document.getElementById("ideaSaveStatus");
    const ideaDeleteToast = document.getElementById("ideaDeleteToast");

    document.getElementById("prevBtn").addEventListener("click", () => movePeriod(-1));
    document.getElementById("nextBtn").addEventListener("click", () => movePeriod(1));
    document.getElementById("todayBtn").addEventListener("click", () => { cursor = new Date(); render(); });
    document.getElementById("newPostBtn").addEventListener("click", () => {
      setAppPage("planner");
      openEditor({ date: toDateInput(new Date()) });
    });
    document.getElementById("plannerNavBtn").addEventListener("click", () => setAppPage("planner"));
    document.getElementById("ideasNavBtn").addEventListener("click", () => setAppPage("ideas"));
    document.getElementById("newIdeaBtn").addEventListener("click", createIdeaDocument);
    document.getElementById("emptyNewIdeaBtn").addEventListener("click", createIdeaDocument);
    document.getElementById("undoIdeaDeleteBtn").addEventListener("click", undoIdeaDelete);
    document.getElementById("monthViewBtn").addEventListener("click", () => setView("month"));
    document.getElementById("weekViewBtn").addEventListener("click", () => setView("week"));
    document.getElementById("closeDrawerBtn").addEventListener("click", closeEditor);
    document.getElementById("cancelBtn").addEventListener("click", closeEditor);
    document.getElementById("saveBtn").addEventListener("click", savePost);
    document.getElementById("deleteBtn").addEventListener("click", deletePost);
    backdrop.addEventListener("click", closeEditor);
    searchInput.addEventListener("input", render);
    form.addEventListener("submit", event => {
      event.preventDefault();
      savePost();
    });
    document.querySelectorAll("[data-media]").forEach(button => {
      button.addEventListener("click", () => handleMediaChoice(button.dataset.media));
    });

    documentInput.addEventListener("change", () => handleFileSelection(documentInput, "document"));
    ["postDate", "postTime"].forEach(id => {
      document.getElementById(id).addEventListener("input", updateScheduleSummary);
    });

    document.getElementById("filters").addEventListener("click", (event) => {
      const button = event.target.closest("[data-filter]");
      if (!button) return;
      filter = button.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach(item => item.classList.toggle("active", item === button));
      render();
    });

    ideasList.addEventListener("click", event => {
      const deleteButton = event.target.closest("[data-delete-idea]");
      if (deleteButton) {
        event.stopPropagation();
        deleteIdeaDocument(deleteButton.dataset.deleteIdea);
        return;
      }
      const item = event.target.closest("[data-idea-id]");
      if (item) selectIdeaDocument(item.dataset.ideaId);
    });

    [ideaTitle, ideaContent].forEach(element => {
      element.addEventListener("input", scheduleIdeaSave);
    });

    document.querySelectorAll("[data-idea-command]").forEach(button => {
      button.addEventListener("mousedown", event => {
        event.preventDefault();
        ideaContent.focus();
        document.execCommand(button.dataset.ideaCommand, false);
        scheduleIdeaSave();
      });
    });

    document.getElementById("ideaBlockType").addEventListener("change", event => {
      ideaContent.focus();
      document.execCommand("formatBlock", false, event.target.value);
      scheduleIdeaSave();
      event.target.value = "p";
    });

    render();
    renderIdeaDocuments();
    initSupabase();

    function loadPosts() {
  const saved = localStorage.getItem(storageKey);

  if (saved) {
    try {
      return JSON.parse(saved).map(post => ({
        ...post,
        notes: post.notes ?? post.hook ?? ""
      }));
    } catch (error) {
      console.warn("Lokale planning kon niet worden gelezen:", error);
    }
  }

  return [];
}

    function savePosts() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(posts));
        return true;
      } catch (error) {
        alert("Opslaan lukt niet omdat de browseropslag vol zit. Verwijder een grote bijlage of kies een kleiner bestand.");
        return false;
      }
    }

    function loadIdeaDocuments() {
      const saved = localStorage.getItem(ideasStorageKey);
      if (!saved) return [];
      try {
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        console.warn("Lokale ideeën konden niet worden gelezen:", error);
        return [];
      }
    }

    function loadDeletedIdeaIds() {
      const saved = localStorage.getItem(deletedIdeasStorageKey);
      if (!saved) return [];
      try {
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        console.warn("Verwijderde ideeën konden niet worden gelezen:", error);
        return [];
      }
    }

    function saveDeletedIdeaIds() {
      localStorage.setItem(deletedIdeasStorageKey, JSON.stringify(Array.from(deletedIdeaIds)));
    }

    function saveIdeaDocuments() {
      try {
        localStorage.setItem(ideasStorageKey, JSON.stringify(ideaDocuments));
        return true;
      } catch (error) {
        ideaSaveStatus.textContent = "Opslaan mislukt";
        alert("De ideeën konden niet lokaal worden opgeslagen.");
        return false;
      }
    }

    function setAppPage(page) {
      const showIdeas = page === "ideas";
      if (!showIdeas && ideasPage.classList.contains("active")) persistActiveIdea(true);
      plannerPage.classList.toggle("active", !showIdeas);
      ideasPage.classList.toggle("active", showIdeas);
      document.getElementById("plannerNavBtn").classList.toggle("active", !showIdeas);
      document.getElementById("ideasNavBtn").classList.toggle("active", showIdeas);
      document.querySelectorAll(".planner-only").forEach(element => {
        element.hidden = showIdeas;
      });
      if (showIdeas) renderIdeaDocuments();
    }

    function createIdeaDocument() {
      persistActiveIdea(true);
      const now = new Date().toISOString();
      const documentItem = {
        id: crypto.randomUUID(),
        title: "Nieuw ideeën-document",
        content: "",
        createdAt: now,
        updatedAt: now
      };
      ideaDocuments.unshift(documentItem);
      activeIdeaId = documentItem.id;
      localStorage.setItem(activeIdeaStorageKey, activeIdeaId);
      saveIdeaDocuments();
      renderIdeaDocuments();
      setAppPage("ideas");
      upsertRemoteIdea(documentItem);
      requestAnimationFrame(() => {
        ideaTitle.focus();
        ideaTitle.select();
      });
    }

    function selectIdeaDocument(id) {
      if (id === activeIdeaId) return;
      persistActiveIdea(true);
      activeIdeaId = id;
      localStorage.setItem(activeIdeaStorageKey, activeIdeaId);
      renderIdeaDocuments();
    }

    function deleteIdeaDocument(id) {
      const documentItem = ideaDocuments.find(item => item.id === id);
      if (!documentItem) return;
      if (id === activeIdeaId) {
        clearTimeout(ideaSaveTimer);
        ideaSaveTimer = null;
      }
      recentlyDeletedIdea = { ...documentItem };
      deletedIdeaIds.add(id);
      saveDeletedIdeaIds();
      ideaDocuments = ideaDocuments.filter(item => item.id !== id);
      activeIdeaId = ideaDocuments[0]?.id || "";
      localStorage.setItem(activeIdeaStorageKey, activeIdeaId);
      saveIdeaDocuments();
      renderIdeaDocuments();
      deleteRemoteIdea(id);
      showIdeaDeleteToast();
    }

    function undoIdeaDelete() {
      if (!recentlyDeletedIdea) return;
      const documentItem = recentlyDeletedIdea;
      recentlyDeletedIdea = null;
      clearTimeout(ideaToastTimer);
      ideaDeleteToast.classList.remove("visible");
      deletedIdeaIds.delete(documentItem.id);
      saveDeletedIdeaIds();
      if (!ideaDocuments.some(item => item.id === documentItem.id)) {
        documentItem.updatedAt = new Date().toISOString();
        ideaDocuments.unshift(documentItem);
      }
      activeIdeaId = documentItem.id;
      localStorage.setItem(activeIdeaStorageKey, activeIdeaId);
      saveIdeaDocuments();
      renderIdeaDocuments();
      upsertRemoteIdea(documentItem);
    }

    function showIdeaDeleteToast() {
      clearTimeout(ideaToastTimer);
      ideaDeleteToast.classList.add("visible");
      ideaToastTimer = setTimeout(() => {
        ideaDeleteToast.classList.remove("visible");
        recentlyDeletedIdea = null;
      }, 5000);
    }

    function renderIdeaDocuments(options = {}) {
      if (activeIdeaId && !ideaDocuments.some(item => item.id === activeIdeaId)) {
        activeIdeaId = ideaDocuments[0]?.id || "";
      }
      if (!activeIdeaId && ideaDocuments.length) activeIdeaId = ideaDocuments[0].id;
      localStorage.setItem(activeIdeaStorageKey, activeIdeaId);

      ideaCount.textContent = ideaDocuments.length;
      ideasList.innerHTML = ideaDocuments.length
        ? ideaDocuments
            .slice()
            .sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""))
            .map(item => `
              <div class="idea-document-item${item.id === activeIdeaId ? " active" : ""}" data-idea-id="${item.id}" role="button" tabindex="0">
                <div>
                  <span class="idea-document-title">${escapeHtml(item.title || "Naamloos document")}</span>
                  <span class="idea-document-date">${formatIdeaDate(item.updatedAt)}</span>
                </div>
                <button class="idea-document-delete" type="button" data-delete-idea="${item.id}" title="Document verwijderen" aria-label="Document verwijderen">×</button>
              </div>
            `).join("")
        : `<div class="ideas-empty-list">Nog geen documenten. Maak een document aan om je eerste ideeën te verzamelen.</div>`;

      const activeDocument = ideaDocuments.find(item => item.id === activeIdeaId);
      ideaPaper.hidden = !activeDocument;
      ideaEmptyEditor.hidden = Boolean(activeDocument);
      document.getElementById("ideaFormatbar").hidden = !activeDocument;

      if (activeDocument && !options.preserveEditor) {
        ideaTitle.value = activeDocument.title || "";
        ideaContent.innerHTML = sanitizeIdeaHtml(activeDocument.content || "");
        ideaSaveStatus.textContent = "Alles opgeslagen";
      }
    }

    function scheduleIdeaSave() {
      const activeDocument = persistActiveIdea(false);
      if (!activeDocument) return;
      ideaSaveStatus.textContent = "Opslaan...";
      clearTimeout(ideaSaveTimer);
      ideaSaveTimer = setTimeout(async () => {
        const savedRemotely = await upsertRemoteIdea(activeDocument);
        ideaSaveStatus.textContent = savedRemotely === true
          ? "Alles opgeslagen"
          : savedRemotely === false
            ? "Lokaal opgeslagen"
            : "Opgeslagen in browser";
      }, 900);
    }

    function persistActiveIdea(syncRemote) {
      const activeDocument = ideaDocuments.find(item => item.id === activeIdeaId);
      if (!activeDocument || ideaPaper.hidden) return null;
      activeDocument.title = ideaTitle.value.trim() || "Naamloos document";
      activeDocument.content = sanitizeIdeaHtml(ideaContent.innerHTML);
      activeDocument.updatedAt = new Date().toISOString();
      if (saveIdeaDocuments()) {
        renderIdeaDocuments({ preserveEditor: true });
        if (syncRemote) {
          clearTimeout(ideaSaveTimer);
          ideaSaveTimer = null;
          upsertRemoteIdea(activeDocument);
        }
      }
      return activeDocument;
    }

    function mergeIdeaDocuments(localDocuments, remoteDocuments) {
      const merged = new Map(remoteDocuments.map(item => [item.id, item]));
      const pending = [];
      localDocuments.forEach(localDocument => {
        const remoteDocument = merged.get(localDocument.id);
        if (!remoteDocument || (localDocument.updatedAt || "") > (remoteDocument.updatedAt || "")) {
          merged.set(localDocument.id, localDocument);
          pending.push(localDocument);
        }
      });
      return {
        documents: Array.from(merged.values()).sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || "")),
        pending
      };
    }

    function sanitizeIdeaHtml(html) {
      const container = document.createElement("div");
      container.innerHTML = html || "";
      const allowed = new Set(["P", "BR", "H2", "UL", "OL", "LI", "STRONG", "B", "EM", "I"]);
      const dangerous = new Set(["SCRIPT", "STYLE", "IFRAME", "OBJECT", "EMBED", "LINK", "META"]);
      Array.from(container.querySelectorAll("*")).forEach(element => {
        if (dangerous.has(element.tagName)) {
          element.remove();
          return;
        }
        if (!allowed.has(element.tagName)) {
          element.replaceWith(...Array.from(element.childNodes));
          return;
        }
        Array.from(element.attributes).forEach(attribute => element.removeAttribute(attribute.name));
      });
      return container.innerHTML;
    }

    function formatIdeaDate(value) {
      const date = value ? new Date(value) : new Date();
      return date.toLocaleDateString("nl-NL", { day: "numeric", month: "short", year: "numeric" });
    }

    function isIdeaEditorFocused() {
      return document.activeElement === ideaTitle || document.activeElement === ideaContent;
    }

    async function initSupabase() {
      const hasConfig = supabaseConfig.url && supabaseConfig.anonKey && !supabaseConfig.anonKey.includes("PASTE_YOUR");
      if (!hasConfig || !window.supabase) return;

      supabaseClient = window.supabase.createClient(supabaseConfig.url, supabaseConfig.anonKey);
      const loaded = await loadRemotePosts();
      if (!loaded) return;

      remoteReady = true;
      const ideasToDelete = Array.from(deletedIdeaIds);
      for (const id of ideasToDelete) {
        await deleteRemoteIdea(id);
      }
      const ideasToSync = pendingIdeaSync.slice();
      pendingIdeaSync = [];
      for (const documentItem of ideasToSync) {
        await upsertRemoteIdea(documentItem);
      }
      supabaseClient
        .channel("linkedin-posts-calendar")
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: supabaseConfig.table },
          () => loadRemotePosts()
        )
        .subscribe();
    }

    async function loadRemotePosts() {
      if (!supabaseClient) return false;
      const { data, error } = await supabaseClient
        .from(supabaseConfig.table)
        .select("*")
        .order("date", { ascending: true })
        .order("time", { ascending: true });

      if (error) {
        console.warn("Supabase laden mislukt:", error.message);
        return false;
      }

      const rows = data || [];
      posts = rows.filter(row => row.type !== ideaRowType).map(rowToPost);
      const remoteIdeas = rows
        .filter(row => row.type === ideaRowType && !deletedIdeaIds.has(row.id))
        .map(rowToIdeaDocument);
      const mergedIdeas = mergeIdeaDocuments(ideaDocuments, remoteIdeas);
      ideaDocuments = mergedIdeas.documents;
      pendingIdeaSync = mergedIdeas.pending;
      savePosts();
      saveIdeaDocuments();
      render();
      renderIdeaDocuments({ preserveEditor: isIdeaEditorFocused() });
      return true;
    }

    async function upsertRemotePost(post) {
      if (!remoteReady || !supabaseClient) return;
      const { error } = await supabaseClient
        .from(supabaseConfig.table)
        .upsert(postToRow(post), { onConflict: "id" });

      if (error) {
        alert(`Opslaan in Supabase lukte niet: ${error.message}`);
      }
    }

    async function deleteRemotePost(id) {
      if (!remoteReady || !supabaseClient) return;
      const { error } = await supabaseClient
        .from(supabaseConfig.table)
        .delete()
        .eq("id", id);

      if (error) {
        alert(`Verwijderen in Supabase lukte niet: ${error.message}`);
      }
    }

    async function upsertRemoteIdea(documentItem) {
      if (!remoteReady || !supabaseClient) return null;
      const { error } = await supabaseClient
        .from(supabaseConfig.table)
        .upsert(ideaToRow(documentItem), { onConflict: "id" });

      if (error) {
        console.warn("Idee synchroniseren mislukt:", error.message);
        return false;
      }
      return true;
    }

    async function deleteRemoteIdea(id) {
      if (!remoteReady || !supabaseClient) return null;
      const { error } = await supabaseClient
        .from(supabaseConfig.table)
        .delete()
        .eq("id", id);

      if (error) {
        console.warn("Idee verwijderen uit Supabase mislukt:", error.message);
        return false;
      }
      deletedIdeaIds.delete(id);
      saveDeletedIdeaIds();
      return true;
    }

    function ideaToRow(documentItem) {
      return {
        id: documentItem.id,
        title: documentItem.title || "Naamloos document",
        date: (documentItem.createdAt || new Date().toISOString()).slice(0, 10),
        time: "09:00",
        type: ideaRowType,
        media: "tekst",
        attachment: null,
        status: "idea",
        hook: "",
        text: documentItem.content || "",
        goal: "Zichtbaarheid",
        updated_at: documentItem.updatedAt || new Date().toISOString()
      };
    }

    function rowToIdeaDocument(row) {
      const timestamp = row.updated_at || `${row.date || toDateInput(new Date())}T00:00:00.000Z`;
      return {
        id: row.id,
        title: row.title || "Naamloos document",
        content: row.text || "",
        createdAt: row.date ? `${row.date}T00:00:00.000Z` : timestamp,
        updatedAt: timestamp
      };
    }

    function postToRow(post) {
      return {
        id: post.id,
        title: post.title,
        date: post.date,
        time: post.time,
        type: post.type,
        media: post.media,
        attachment: post.attachment,
        status: post.status,
        hook: post.notes || post.hook || "",
        text: post.text,
        goal: post.goal,
        updated_at: new Date().toISOString()
      };
    }

    function rowToPost(row) {
      return {
        id: row.id,
        title: row.title || "",
        date: row.date,
        time: row.time || "",
        type: row.type || "Thought leadership",
        media: row.media || "tekst",
        attachment: row.attachment || null,
        status: row.status || "idea",
        notes: row.hook || "",
        text: row.text || "",
        goal: row.goal || "Zichtbaarheid"
      };
    }

    function render() {
      if (view === "month") renderMonth();
      else renderWeek();
      renderStats();
    }

    function renderStats() {
      const month = cursor.getMonth();
      const year = cursor.getFullYear();
      const monthPosts = posts.filter(post => {
        const date = parseLocalDate(post.date);
        return date.getMonth() === month && date.getFullYear() === year;
      });
      monthCount.textContent = monthPosts.length;
      readyCount.textContent = monthPosts.filter(post => post.status === "ready").length;
    }

    function renderMonth() {
      const year = cursor.getFullYear();
      const month = cursor.getMonth();
      periodTitle.textContent = `${capitalize(monthNames[month])} ${year}`;
      periodHint.textContent = "Maandoverzicht";

      const first = new Date(year, month, 1);
      const start = startOfWeek(first);
      const days = Array.from({ length: 42 }, (_, index) => addDays(start, index));
      const todayKey = toDateInput(new Date());

      root.innerHTML = `
        <section class="calendar">
          <div class="weekdays">${weekdays.map(day => `<div>${day}</div>`).join("")}</div>
          <div class="month-grid">
            ${days.map(day => renderDay(day, month, todayKey)).join("")}
          </div>
        </section>
      `;

      root.querySelectorAll("[data-add-date]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          openEditor({ date: button.dataset.addDate });
        });
      });

      root.querySelectorAll("[data-post-id]").forEach(card => {
        card.addEventListener("click", () => openEditor(posts.find(post => post.id === card.dataset.postId)));
      });
    }

    function renderDay(day, activeMonth, todayKey) {
      const dateKey = toDateInput(day);
      const dayPosts = filteredPosts().filter(post => post.date === dateKey).sort(sortByTime);
      const outside = day.getMonth() !== activeMonth ? " outside" : "";
      const today = dateKey === todayKey ? " today" : "";
      return `
        <div class="day${outside}${today}">
          <div class="day-top">
            <span class="day-number">${day.getDate()}</span>
            <button class="mini-add" data-add-date="${dateKey}" title="Post toevoegen" aria-label="Post toevoegen">+</button>
          </div>
          ${dayPosts.map(renderPostCard).join("")}
        </div>
      `;
    }

    function renderWeek() {
      const start = startOfWeek(cursor);
      const days = Array.from({ length: 7 }, (_, index) => addDays(start, index));
      const end = days[6];
      periodTitle.textContent = `${start.getDate()} ${monthNames[start.getMonth()]} - ${end.getDate()} ${monthNames[end.getMonth()]}`;
      periodHint.textContent = "Weekoverzicht";

      root.innerHTML = `
        <section class="week-list">
          ${days.map(day => {
            const dateKey = toDateInput(day);
            const dayPosts = filteredPosts().filter(post => post.date === dateKey).sort(sortByTime);
            return `
              <div class="week-row">
                <div class="week-date">
                  <span class="subtle">${weekdays[(day.getDay() + 6) % 7]}</span>
                  <strong>${day.getDate()} ${monthNames[day.getMonth()]}</strong>
                  <button data-add-date="${dateKey}">Toevoegen</button>
                </div>
                <div class="week-posts">
                  ${dayPosts.length ? dayPosts.map(renderPostCard).join("") : `<div class="empty">Nog niets gepland</div>`}
                </div>
              </div>
            `;
          }).join("")}
        </section>
      `;

      root.querySelectorAll("[data-add-date]").forEach(button => {
        button.addEventListener("click", () => openEditor({ date: button.dataset.addDate }));
      });

      root.querySelectorAll("[data-post-id]").forEach(card => {
        card.addEventListener("click", () => openEditor(posts.find(post => post.id === card.dataset.postId)));
      });
    }

    function renderPostCard(post) {
      const title = escapeHtml(post.title || "Zonder titel");
      const copy = escapeHtml(post.text || "Nog geen tekst. Open deze post om de inhoud te schrijven.");
      const media = post.media || "tekst";
      const mediaBlock = renderMediaBlock(post, media);
      return `
        <article class="post ${post.status}" data-post-id="${post.id}" tabindex="0">
          <div class="post-copy">${copy}</div>
          ${mediaBlock}
          <div class="post-title">${title}</div>
          <div class="post-meta">
            <span>${post.time || "--:--"}</span>
            <span>·</span>
            <span class="dot ${post.status}"></span>
            <span>${statusLabels[post.status]}</span>
          </div>
        </article>
      `;
    }

    function filteredPosts() {
      const query = searchInput.value.trim().toLowerCase();
      return posts.filter(post => {
        const matchesFilter = filter === "all" || post.status === filter;
        const haystack = [post.title, post.notes, post.hook, post.text, post.media].join(" ").toLowerCase();
        return matchesFilter && (!query || haystack.includes(query));
      });
    }

    function openEditor(post) {
      const editing = Boolean(post.id);
      document.getElementById("postId").value = post.id || "";
      document.getElementById("postTitle").value = post.title || "";
      document.getElementById("postDate").value = post.date || toDateInput(new Date());
      document.getElementById("postTime").value = post.time || "09:00";
      currentAttachment = post.attachment || null;
      setMedia(post.media || "tekst");
      renderAttachmentPreview();
      document.getElementById("postStatus").value = post.status || "idea";
      document.getElementById("postText").value = post.text || "";
      document.getElementById("postNotes").value = post.notes || post.hook || "";
      document.getElementById("deleteBtn").style.visibility = editing ? "visible" : "hidden";
      updateScheduleSummary();
      drawer.classList.add("open");
      backdrop.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      document.getElementById("postText").focus();
    }

    function closeEditor() {
      drawer.classList.remove("open");
      backdrop.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
      form.reset();
      currentAttachment = null;
      renderAttachmentPreview();
    }

    function savePost() {
      if (!form.reportValidity()) return;
      const id = document.getElementById("postId").value || crypto.randomUUID();
      const existingPost = posts.find(item => item.id === id);
      const post = {
        id,
        title: document.getElementById("postTitle").value.trim(),
        date: document.getElementById("postDate").value,
        time: document.getElementById("postTime").value,
        type: existingPost?.type || "Thought leadership",
        media: document.getElementById("postMedia").value,
        attachment: currentAttachment,
        status: document.getElementById("postStatus").value,
        text: document.getElementById("postText").value.trim(),
        notes: document.getElementById("postNotes").value.trim(),
        goal: existingPost?.goal || "Zichtbaarheid"
      };

      const index = posts.findIndex(item => item.id === id);
      if (index >= 0) posts[index] = post;
      else posts.push(post);
      if (savePosts()) {
        upsertRemotePost(post);
        closeEditor();
        render();
      }
    }

    function deletePost() {
      const id = document.getElementById("postId").value;
      if (!id) return;
      posts = posts.filter(post => post.id !== id);
      if (savePosts()) {
        deleteRemotePost(id);
        closeEditor();
        render();
      }
    }

    function movePeriod(direction) {
      if (view === "month") cursor = new Date(cursor.getFullYear(), cursor.getMonth() + direction, 1);
      else cursor = addDays(cursor, direction * 7);
      render();
    }

    function setView(nextView) {
      view = nextView;
      document.getElementById("monthViewBtn").classList.toggle("active", view === "month");
      document.getElementById("weekViewBtn").classList.toggle("active", view === "week");
      render();
    }

    function setMedia(media) {
      document.getElementById("postMedia").value = media;
      document.querySelectorAll("[data-media]").forEach(button => {
        button.classList.toggle("active", button.dataset.media === media);
      });
    }

    function handleMediaChoice(media) {
      setMedia(media);
      if (media === "foto") {
        photoInput.value = "";
        photoInput.click();
      } else if (media === "document") {
        documentInput.value = "";
        documentInput.click();
      } else if (media !== "foto" && media !== "document") {
        currentAttachment = null;
        renderAttachmentPreview();
      }
    }

    function handleFileSelection(input, media) {
      const file = input.files && input.files[0];
      if (!file) return;
      if (file.size > maxAttachmentSize) {
        alert("Dit bestand is groter dan 10 MB. Kies een kleinere versie, zodat de planner snel blijft.");
        input.value = "";
        return;
      }

      const reader = new FileReader();
      reader.addEventListener("load", () => {
        currentAttachment = {
          name: file.name,
          type: file.type || "application/octet-stream",
          size: file.size,
          dataUrl: reader.result
        };
        setMedia(media);
        renderAttachmentPreview();
      });
      reader.readAsDataURL(file);
    }

    function renderAttachmentPreview() {
      if (!currentAttachment) {
        attachmentPreview.classList.remove("visible");
        attachmentPreview.classList.remove("image-preview");
        attachmentPreview.innerHTML = "";
        return;
      }

      attachmentPreview.classList.add("visible");
      attachmentPreview.classList.toggle("image-preview", (currentAttachment.type || "").startsWith("image/"));
      if ((currentAttachment.type || "").startsWith("image/")) {
        attachmentPreview.innerHTML = `
          <img class="attachment-image" src="${currentAttachment.dataUrl}" alt="${escapeHtml(currentAttachment.name)}">
          <button type="button" class="attachment-remove image-remove js-remove-attachment" aria-label="Bijlage verwijderen">x</button>
        `;
      } else {
        attachmentPreview.innerHTML = `
          <div class="attachment-file">
            <div class="attachment-icon">DOC</div>
            <div>
              <div class="attachment-name">${escapeHtml(currentAttachment.name)}</div>
              <div class="attachment-meta">${formatBytes(currentAttachment.size)}</div>
            </div>
            <button type="button" class="attachment-remove js-remove-attachment" aria-label="Bijlage verwijderen">x</button>
          </div>
        `;
      }

      attachmentPreview.querySelector(".js-remove-attachment").addEventListener("click", () => {
        currentAttachment = null;
        setMedia("tekst");
        renderAttachmentPreview();
      });
    }

    function renderMediaBlock(post, media) {
      const attachment = post.attachment;
      if (attachment && (attachment.type || "").startsWith("image/")) {
        return `<div class="post-media image-media"><img src="${attachment.dataUrl}" alt="${escapeHtml(attachment.name)}"></div>`;
      }
      if (attachment) {
        return `
          <div class="post-media">
            <div class="post-document">
              <span>${mediaIcons.document}</span>
              <div>
                <strong>${escapeHtml(attachment.name)}</strong>
                <small>${formatBytes(attachment.size)}</small>
              </div>
            </div>
          </div>
        `;
      }
      return media === "tekst" ? "" : `<div class="post-media">${mediaIcons[media] || "+"} ${mediaLabels[media] || "Media"}</div>`;
    }

    function updateScheduleSummary() {
      const dateValue = document.getElementById("postDate").value;
      const timeValue = document.getElementById("postTime").value;
      const summary = document.getElementById("scheduleSummary");
      if (!dateValue) {
        summary.textContent = "Nog niet gepland";
        return;
      }
      const date = parseLocalDate(dateValue);
      summary.textContent = `${date.getDate()} ${monthNames[date.getMonth()]} om ${timeValue || "--:--"}`;
    }

    function startOfWeek(date) {
      const copy = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const day = (copy.getDay() + 6) % 7;
      copy.setDate(copy.getDate() - day);
      return copy;
    }

    function addDays(date, amount) {
      const copy = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      copy.setDate(copy.getDate() + amount);
      return copy;
    }

    function toDateInput(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function parseLocalDate(value) {
      const [year, month, day] = value.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function sortByTime(a, b) {
      return (a.time || "").localeCompare(b.time || "");
    }

    function formatBytes(bytes) {
      if (!bytes) return "0 KB";
      const units = ["B", "KB", "MB"];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value = value / 1024;
        unit += 1;
      }
      return `${value.toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
    }

    function capitalize(value) {
      return value.charAt(0).toUpperCase() + value.slice(1);
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[character]));
    }
  </script>
</body>
